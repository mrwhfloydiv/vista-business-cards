<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#eceef1">
<title>Julie M. Miller — Vista Site Selection</title>
<meta name="description" content="Contact card for Julie M. Miller, Managing Director at Vista Site Selection.">
<link rel="icon" type="image/svg+xml" href="../assets/vista-icon.svg">
<link rel="icon" type="image/png" href="../assets/vista-v.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

<style>
:root {
  --vista-black: #14191c;
  --vista-white: #fafafa;
  --vista-red: #b22c2e;
  --vista-red-dark: #8e2123;
  --vista-yellow: #ebaa1f;
  --vista-blue: #b5d9ee;
  --ink: #14191c;
  --paper: #eceef1;
  --paper-card: #ffffff;
  --ink-soft: #5a6168;
  --line: #d8dbdf;
  --line-soft: #e3e6ea;
  --shadow-sm: 0 1px 2px rgba(20, 25, 28, 0.04), 0 1px 3px rgba(20, 25, 28, 0.06);
  --shadow-md: 0 4px 14px rgba(20, 25, 28, 0.08), 0 2px 6px rgba(20, 25, 28, 0.04);
  --shadow-lg: 0 24px 60px rgba(20, 25, 28, 0.10), 0 8px 20px rgba(20, 25, 28, 0.06);
  --radius: 14px;
  --radius-lg: 22px;
  --t: 220ms cubic-bezier(.22,.61,.36,1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'Manrope', system-ui, -apple-system, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(900px 500px at 88% -200px, rgba(181, 217, 238, 0.20), transparent 60%),
    radial-gradient(700px 400px at -80px 600px, rgba(235, 170, 31, 0.08), transparent 60%),
    var(--paper);
  overflow-x: hidden;
}

/* Interactive grid canvas — fixed full-viewport, behind content */
.bg-grid {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 0;
  display: block;
}
.bg-grain {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  opacity: 0.18;
  mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.08  0 0 0 0 0.10  0 0 0 0 0.11  0 0 0 0.5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}

.site-header, main, .site-footer { position: relative; z-index: 2; }

/* ============ HEADER ============ */
.site-header {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 18px 22px;
  border-bottom: 1px solid var(--line);
  background: rgba(250, 250, 250, 0.7);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  position: sticky;
  top: 0;
  z-index: 10;
}
.brand { display: block; text-decoration: none; line-height: 0; }
.brand-wordmark {
  height: clamp(17px, 5.5vw, 26px);
  max-width: min(86vw, 440px);
  object-fit: contain;
  transition: transform var(--t);
}
.brand:hover .brand-wordmark { transform: translateY(-1px); }
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.85); }
}

/* ============ MAIN ============ */
main {
  flex: 1;
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  padding: 44px 20px 72px;
}

/* ============ HERO / IDENTITY ============ */
.card-hero { text-align: center; margin-bottom: 34px; }

.portrait-wrap {
  position: relative;
  display: inline-block;
  margin: 10px 0 24px;
  animation: portraitIn 700ms cubic-bezier(.22,.61,.36,1) both;
}
@keyframes portraitIn {
  from { opacity: 0; transform: translateY(20px) scale(0.94); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.portrait {
  width: 148px;
  height: 148px;
  border-radius: 50%;
  overflow: hidden;
  border: 5px solid white;
  box-shadow: var(--shadow-lg);
  background: white;
  transition: transform var(--t);
}
.portrait-wrap:hover .portrait { transform: translateY(-3px) rotate(-2deg); }
.portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
.portrait .initials {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 52px; font-weight: 700;
  color: var(--vista-red);
  background: #fbeaea;
}
/* Little V badge pinned to the portrait */
.portrait-badge {
  position: absolute;
  bottom: 6px; right: 6px;
  width: 38px; height: 38px;
  border-radius: 50%;
  background: white;
  border: 1px solid var(--line);
  box-shadow: var(--shadow-md);
  display: flex; align-items: center; justify-content: center;
}
.portrait-badge img { width: 21px; height: 21px; object-fit: contain; }

.hero-title {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: clamp(36px, 9vw, 54px);
  line-height: 1.04;
  letter-spacing: -0.03em;
  margin-bottom: 14px;
}
.hero-title .accent-serif {
  font-family: 'Instrument Serif', 'Times New Roman', serif;
  font-weight: 400;
  font-style: italic;
  color: var(--vista-red);
  letter-spacing: -0.01em;
  font-size: 1.12em;
  position: relative;
}
.hero-title .accent-serif em {
  font-style: italic;
  position: relative;
  display: inline-block;
}
.hero-title .accent-serif em::after {
  content: '';
  position: absolute;
  left: -2%;
  right: -2%;
  bottom: -0.04em;
  height: 8px;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 8' preserveAspectRatio='none'><path d='M2 5 C 40 1, 80 7, 120 3 S 180 6, 198 4' stroke='%23b22c2e' stroke-width='2.5' fill='none' stroke-linecap='round'/></svg>");
  background-size: 100% 100%;
  background-repeat: no-repeat;
  transform-origin: left center;
  animation: drawLine 700ms 900ms cubic-bezier(.65,0,.35,1) both;
}
@keyframes drawLine {
  0% { transform: scaleX(0); opacity: 0; }
  100% { transform: scaleX(1); opacity: 1; }
}
.reveal-word {
  display: inline-block;
  opacity: 0;
  transform: translateY(28px);
  animation: revealWord 720ms cubic-bezier(.22,.61,.36,1) forwards;
  animation-delay: var(--d, 0ms);
}
@keyframes revealWord { to { opacity: 1; transform: translateY(0); } }
.reveal-fade {
  opacity: 0;
  animation: revealFade 600ms ease forwards;
  animation-delay: var(--d, 0ms);
}
@keyframes revealFade { to { opacity: 1; } }

.hero-role {
  font-size: 16px;
  line-height: 1.5;
  color: var(--ink-soft);
  font-weight: 500;
  max-width: 420px;
  margin: 0 auto 6px;
}
.hero-company {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--vista-red);
  font-weight: 500;
}

/* ============ QUICK ACTIONS ============ */
.quick-actions {
  display: flex;
  justify-content: center;
  gap: 22px;
  margin: 30px 0 26px;
}
.qa {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  text-decoration: none;
}
.qa-btn {
  width: 56px; height: 56px;
  border-radius: 50%;
  background: var(--vista-black);
  color: white;
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow-md);
  transition: all var(--t);
}
.qa-btn svg { width: 23px; height: 23px; fill: currentColor; }
.qa:hover .qa-btn, .qa:active .qa-btn {
  background: var(--vista-red);
  transform: translateY(-3px);
  box-shadow: 0 14px 34px rgba(178, 44, 46, 0.32), var(--shadow-md);
}
.qa-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 0.16em;
  color: var(--ink-soft);
  transition: color var(--t);
}
.qa:hover .qa-label { color: var(--vista-red); }
@media (max-width: 350px) {
  .quick-actions { gap: 12px; }
  .qa-btn { width: 50px; height: 50px; }
}

/* ============ SAVE CTA ============ */
/* Animated brand-color border: Vista red → gold → blue flowing around the
   button, with a matching soft glow — the "this is the one to tap" signal. */
.cta-wrap {
  position: relative;
  border-radius: calc(var(--radius) + 3px);
  padding: 3px;
  background: linear-gradient(90deg,
    var(--vista-red), var(--vista-yellow), var(--vista-blue),
    var(--vista-yellow), var(--vista-red));
  background-size: 300% 100%;
  animation: borderFlow 5s linear infinite, borderGlow 5s linear infinite;
}
@keyframes borderFlow {
  to { background-position: -300% 0; }
}
@keyframes borderGlow {
  0%, 100% { box-shadow: 0 6px 26px rgba(178, 44, 46, 0.32); }
  33%      { box-shadow: 0 6px 26px rgba(235, 170, 31, 0.34); }
  66%      { box-shadow: 0 6px 26px rgba(181, 217, 238, 0.55); }
}
@media (prefers-reduced-motion: reduce) {
  .cta-wrap { animation: none; }
}
.cta-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  width: 100%;
  background: var(--vista-black);
  color: white;
  padding: 21px 40px;
  border-radius: var(--radius);
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 0.1em;
  cursor: pointer;
  text-decoration: none;
  transition: transform var(--t), box-shadow var(--t);
  position: relative;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(20, 25, 28, 0.18), 0 2px 6px rgba(20, 25, 28, 0.10);
}
.cta-button::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--vista-red);
  transform: translateX(-101%);
  transition: transform 420ms cubic-bezier(.65,0,.35,1);
  z-index: 0;
}
.cta-button::after {
  content: '';
  position: absolute;
  top: 0; bottom: 0;
  left: -40%;
  width: 30%;
  background: linear-gradient(110deg, transparent 0%, rgba(255,255,255,0.18) 50%, transparent 100%);
  transform: skewX(-18deg);
  animation: shine 3.4s ease-in-out infinite;
  z-index: 1;
  pointer-events: none;
}
@keyframes shine {
  0%   { left: -40%; }
  60%  { left: 130%; }
  100% { left: 130%; }
}
.cta-button:hover { transform: translateY(-3px); box-shadow: 0 18px 50px rgba(178, 44, 46, 0.32), 0 4px 12px rgba(20, 25, 28, 0.12); }
.cta-button:hover::before, .cta-button:active::before { transform: translateX(0); }
.cta-button:active { transform: translateY(-1px); }
.cta-label, .cta-arrow { position: relative; z-index: 2; }
.cta-arrow { font-size: 20px; transition: transform var(--t); }
.cta-button:hover .cta-arrow { transform: translateX(6px); }
/* ============ PANELS ============ */
.panel {
  background: var(--paper-card);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 26px 26px 18px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 22px;
  text-align: left;
}
.panel-title {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 600;
  font-size: 23px;
  letter-spacing: -0.02em;
  margin-bottom: 14px;
}
.panel-title em {
  font-family: 'Instrument Serif', 'Times New Roman', serif;
  font-style: italic;
  font-weight: 400;
  color: var(--vista-red);
  font-size: 1.18em;
  position: relative;
  display: inline-block;
}
.panel-title em::after {
  content: '';
  position: absolute;
  left: -3%;
  right: -3%;
  bottom: -0.04em;
  height: 7px;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 8' preserveAspectRatio='none'><path d='M2 5 C 40 1, 80 7, 120 3 S 180 6, 198 4' stroke='%23b22c2e' stroke-width='2.5' fill='none' stroke-linecap='round'/></svg>");
  background-size: 100% 100%;
  background-repeat: no-repeat;
  transform-origin: left center;
  animation: drawLine 680ms 500ms cubic-bezier(.65,0,.35,1) both;
}
.panel-title .title-period {
  color: var(--vista-red);
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 600;
}

.row {
  display: block;
  padding: 13px 0;
  text-decoration: none;
  color: var(--ink);
  border-top: 1px solid var(--line-soft);
  transition: background var(--t);
}
.row:first-of-type { border-top: none; }
.row .label {
  display: block;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-bottom: 3px;
}
.row .value { font-size: 15.5px; font-weight: 600; word-break: break-word; }
a.row .value { color: var(--vista-red); }
a.row:hover .value { color: var(--vista-red-dark); text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 3px; }

.linkrow {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 13px 0;
  text-decoration: none;
  color: var(--ink);
  font-weight: 600;
  font-size: 15px;
  border-top: 1px solid var(--line-soft);
  transition: all var(--t);
}
.linkrow:first-of-type { border-top: none; }
.linkrow .badge {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: var(--vista-black);
  color: white;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: all var(--t);
}
.linkrow .badge svg { width: 19px; height: 19px; fill: currentColor; }
.linkrow:hover .badge { background: var(--vista-red); transform: translateY(-2px); }
.linkrow:hover { color: var(--vista-red); }
.linkrow .go {
  margin-left: auto;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 18px;
  color: var(--ink-soft);
  transition: all var(--t);
}
.linkrow:hover .go { color: var(--vista-red); transform: translateX(4px); }

/* ============ FOOTER ============ */
.site-footer {
  text-align: center;
  padding: 30px 16px 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.footer-icon {
  height: clamp(36px, 11vw, 48px);
  width: auto;
  object-fit: contain;
}
.site-footer em {
  font-family: 'Instrument Serif', 'Times New Roman', serif;
  font-style: italic;
  color: var(--vista-red);
  font-size: 21px;
  letter-spacing: 0.01em;
}
</style>
</head>

<script data-goatcounter="https://vistacards.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<script>
  (function () {
    var slug = "julie-miller";
    var endpoint = "";
    function report(action) {
      try {
        if (window.goatcounter && window.goatcounter.count) {
          window.goatcounter.count({ path: slug + '/' + action, title: slug + ' — ' + action, event: true });
        }
      } catch (e) {}
      try {
        if (endpoint) {
          navigator.sendBeacon(endpoint, JSON.stringify({
            card: slug, action: action, t: Date.now(),
            ref: document.referrer, ua: navigator.userAgent, lang: navigator.language
          }));
        }
      } catch (e) {}
    }
    if (endpoint) report('scan');
    function hook(selector, action) {
      document.querySelectorAll(selector).forEach(function (el) {
        el.addEventListener('click', function () { report(typeof action === 'function' ? action(el) : action); });
      });
    }
    hook('.cta-button', 'save-contact');
    hook('.qa', function (el) { return 'tap-' + (el.querySelector('.qa-label') || {}).textContent.toLowerCase().trim(); });
    hook('.linkrow', function (el) { return 'open-' + el.textContent.trim().toLowerCase().replace(/[^a-z]+/g, '-').replace(/^-|-$/g, ''); });
  })();
</script>
</body>
</html>
